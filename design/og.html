<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600&family=Frank+Ruhl+Libre:wght@500&display=swap">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#FAF8F5;font-family:Assistant,sans-serif;color:#2B302E;position:relative;display:grid;grid-template-columns:1fr 400px;align-items:center;padding:0 90px 0 70px;gap:70px}
body::before{content:"";position:absolute;width:760px;height:760px;border-radius:50%;background:radial-gradient(closest-side,#DCE5DF,rgba(220,229,223,0));left:-170px;top:-60px}
.copy{position:relative;display:grid;gap:26px}
.logo{font-family:"Frank Ruhl Libre",serif;font-size:46px;color:#4A6B5D;direction:ltr;text-align:right}
.logo span{color:#C87D65}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:500;font-size:74px;line-height:1.12;letter-spacing:-.5px}
h1 em{font-style:normal;color:#4A6B5D}
p{font-size:29px;line-height:1.45;color:#5A625E;max-width:600px;text-wrap:balance}
.tag{justify-self:start;display:inline-flex;align-items:center;gap:12px;background:#4A6B5D;color:#fff;font-weight:600;font-size:24px;padding:12px 26px;border-radius:999px}
.tag i{width:10px;height:10px;border-radius:50%;background:#C87D65}
.photo{position:relative;width:400px;height:500px;border-radius:200px 200px 26px 26px;overflow:hidden;background:#DCE5DF;box-shadow:0 30px 60px -30px rgba(43,48,46,.45)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.bar{position:absolute;bottom:0;left:0;right:0;height:14px;background:#4A6B5D}
.bar::after{content:"";position:absolute;inset:0 auto 0 0;width:180px;background:#C87D65}
</style></head><body>
<div class="copy">
  <div class="logo">Setting<span>.</span></div>
  <h1>הסטינג שלך<br><em>מתחיל באתר.</em></h1>
  <p>דפי בית רגועים, מעוצבים ואתיים לפסיכולוגיות ומטפלות</p>
  <div class="tag"><i></i>890 ₪ · מחיר השקה</div>
</div>
<div class="photo"><img src="../images/yedidya.jpg" alt=""></div>
<div class="bar"></div>
</body></html>
